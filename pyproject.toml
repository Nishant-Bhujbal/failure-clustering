[build-system]
requires = ["setuptools>=68"]
build-backend - "setuptools.build_meta"

[project]
name = "cluster-failures"
version = "1.0.0"
description = "Cluster CI test failures across sharded JUnit XML reports by likely root cause."
requires-python = ">=3.9"
dependencies = [
    "rapidfuzz>=3.6",
    "rich>=13.7",
]

[project.scripts]
cluster-failures = "cluster_failures.main__main__:main"

[tools.setuptools]
packages = ["cluster_failures"]
